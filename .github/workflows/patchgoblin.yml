name: Python CI
'on':
  push: {}
  pull_request: {}
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install dependencies
      run: python -m pip install -r requirements.txt
    - name: Check 1
      run: python -m pytest
