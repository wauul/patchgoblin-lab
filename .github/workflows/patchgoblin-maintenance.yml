name: CI maintenance
on:
  push: {}
  pull_request: {}
permissions:
  contents: read
jobs:
  pg_9b44411f2e:
    name: apps/widget · node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: apps/widget/package-lock.json
    - name: Install dependencies
      run: npm ci
      working-directory: apps/widget
    - name: npm run test
      run: npm run test
      working-directory: apps/widget
    - name: npm run typecheck
      run: npm run typecheck
      working-directory: apps/widget
    - name: npm run build
      run: npm run build
      working-directory: apps/widget
